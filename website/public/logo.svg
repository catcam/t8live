<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="72" fill="#161412"/>
  <!-- 4x4 step grid, first step of each row accented (four-on-the-floor motif) -->
  <g>
    <rect x="64"  y="64"  width="88" height="88" rx="14" fill="#ff3b30"/>
    <rect x="176" y="64"  width="88" height="88" rx="14" fill="#f2e8d5"/>
    <rect x="288" y="64"  width="88" height="88" rx="14" fill="#f2e8d5"/>
    <rect x="400" y="64"  width="48" height="88" rx="14" fill="#f2e8d5"/>

    <rect x="64"  y="176" width="88" height="88" rx="14" fill="#ff3b30"/>
    <rect x="176" y="176" width="88" height="88" rx="14" fill="#e0662d"/>
    <rect x="288" y="176" width="88" height="88" rx="14" fill="#f2e8d5"/>
    <rect x="400" y="176" width="48" height="88" rx="14" fill="#f2e8d5"/>

    <rect x="64"  y="288" width="88" height="88" rx="14" fill="#ff3b30"/>
    <rect x="176" y="288" width="88" height="88" rx="14" fill="#f2e8d5"/>
    <rect x="288" y="288" width="88" height="88" rx="14" fill="#e0662d"/>
    <rect x="400" y="288" width="48" height="88" rx="14" fill="#f2e8d5"/>

    <rect x="64"  y="400" width="88" height="48" rx="14" fill="#ff3b30"/>
    <rect x="176" y="400" width="88" height="48" rx="14" fill="#f2e8d5"/>
    <rect x="288" y="400" width="88" height="48" rx="14" fill="#f2e8d5"/>
    <rect x="400" y="400" width="48" height="48" rx="14" fill="#e0662d"/>
  </g>
</svg>
